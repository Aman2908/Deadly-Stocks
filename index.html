<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadly Stocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <a class="brand" href="#/home">
      <svg viewBox="0 0 32 32" width="30" height="30"><circle cx="16" cy="16" r="14.5" fill="none" stroke="#4b8ef7" stroke-width="2"/><path d="M9 11h14M16 11v12M12 17h8" stroke="#e8eef7" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Deadly<b>Stocks</b></span>
    </a>
    <nav id="nav"></nav>
    <div class="side-foot"><span class="dot" id="mktdot"></span><div><small>MARKET</small><div id="mktlabel">—</div></div></div>
  </aside>
  <main>
    <header class="top">
      <button class="burger" onclick="document.body.classList.toggle('nav-open')">☰</button>
      <div><small id="crumb">OVERVIEW</small><h1 id="title">Home</h1></div>
      <div class="top-right">
        <div class="ticker" id="ticker"></div>
        <div class="clock" id="clock"></div>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="tip" class="tip"></div>
<script src="app.js"></script>
</body>
</html>
